<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Commons — Order Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..900&family=Work+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chalk-bg:#1F2E28;
    --chalk-bg-2:#28392F;
    --paper:#F5F1E4;
    --paper-2:#EDE6D2;
    --mustard:#E8A93B;
    --mustard-dark:#C98A22;
    --rust:#C8553D;
    --ink:#16211C;
    --line: rgba(245,241,228,0.18);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  /* ---------- HERO / CHALKBOARD ---------- */
  .board{
    background:
      radial-gradient(ellipse at 20% 0%, rgba(255,255,255,0.04), transparent 60%),
      var(--chalk-bg);
    color:var(--paper);
    padding:2.4rem 1.4rem 2.2rem;
    position:relative;
    overflow:hidden;
    border-bottom:6px solid var(--mustard);
  }
  .board::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color:var(--mustard);
    display:flex; align-items:center; gap:0.5rem;
  }
  .eyebrow::before{
    content:"";
    width:6px; height:6px; border-radius:50%;
    background:var(--mustard);
    animation:pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:0.4; transform:scale(0.8);}
  }
  .board h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:2.5rem;
    line-height:1.05;
    margin:0.7rem 0 0.5rem;
    letter-spacing:-0.01em;
  }
  .board h1 em{
    font-style:italic;
    font-weight:300;
    color:var(--mustard);
  }
  .board p.sub{
    font-size:0.95rem;
    color:rgba(245,241,228,0.72);
    max-width:34ch;
    line-height:1.5;
  }
  .board-meta{
    margin-top:1.4rem;
    display:flex;
    gap:1.4rem;
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    color:rgba(245,241,228,0.6);
    flex-wrap:wrap;
  }
  .board-meta strong{ color:var(--paper); font-weight:500; }

  /* ---------- CATEGORY NAV ---------- */
  .catnav{
    position:sticky; top:0; z-index:20;
    background:var(--paper);
    border-bottom:1px solid rgba(22,33,28,0.12);
    display:flex;
    gap:0.4rem;
    padding:0.7rem 1rem;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .catnav::-webkit-scrollbar{display:none;}
  .cat-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    letter-spacing:0.03em;
    white-space:nowrap;
    padding:0.45rem 0.85rem;
    border-radius:100px;
    border:1px solid rgba(22,33,28,0.2);
    background:transparent;
    color:var(--ink);
    cursor:pointer;
    transition:background 0.15s, color 0.15s, border-color 0.15s;
  }
  .cat-btn.active{
    background:var(--ink);
    color:var(--paper);
    border-color:var(--ink);
  }

  /* ---------- MENU ---------- */
  main{
    padding:1.6rem 1rem 7rem;
    max-width:640px;
    margin:0 auto;
  }
  .section-title{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.3rem;
    margin:2rem 0 0.2rem;
    display:flex;
    align-items:baseline;
    gap:0.6rem;
  }
  .section-title span.count{
    font-family:'JetBrains Mono', monospace;
    font-size:0.7rem;
    color:rgba(22,33,28,0.45);
    font-weight:400;
  }
  .section-title:first-child{ margin-top:0.4rem; }

  .item{
    display:flex;
    justify-content:space-between;
    gap:1rem;
    padding:1rem 0;
    border-bottom:1px dashed rgba(22,33,28,0.18);
  }
  .item-info{ flex:1; }
  .item-name{
    font-weight:600;
    font-size:1rem;
    display:flex;
    align-items:center;
    gap:0.4rem;
  }
  .tag{
    font-family:'JetBrains Mono', monospace;
    font-size:0.6rem;
    padding:0.12rem 0.4rem;
    border-radius:4px;
    text-transform:uppercase;
    letter-spacing:0.03em;
  }
  .tag.veg{ background:#DCE8D6; color:#3D6B45; }
  .tag.spicy{ background:#F3DAD3; color:var(--rust); }
  .tag.limited{ background:#FCE8C2; color:var(--mustard-dark); }
  .item-desc{
    font-size:0.83rem;
    color:rgba(22,33,28,0.6);
    margin-top:0.25rem;
    line-height:1.4;
  }
  .item-price{
    font-family:'JetBrains Mono', monospace;
    font-size:0.85rem;
    color:rgba(22,33,28,0.7);
    margin-top:0.5rem;
  }
  .item-action{
    display:flex;
    flex-direction:column;
    align-items:flex-end;
    justify-content:space-between;
  }
  .add-btn{
    font-family:'JetBrains Mono', monospace;
    font-size:0.72rem;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:0.5rem 0.9rem;
    border-radius:6px;
    cursor:pointer;
    transition:background 0.15s, transform 0.1s;
  }
  .add-btn:active{ transform:scale(0.94); }
  .add-btn:hover{ background:#2D4A3E; }
  .qty-control{
    display:flex;
    align-items:center;
    gap:0.5rem;
    background:var(--ink);
    border-radius:6px;
    padding:0.25rem 0.4rem;
  }
  .qty-control button{
    background:none; border:none; color:var(--paper);
    font-family:'JetBrains Mono', monospace;
    font-size:1rem;
    width:1.4rem; height:1.4rem;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .qty-control span{
    font-family:'JetBrains Mono', monospace;
    color:var(--paper);
    font-size:0.85rem;
    min-width:1ch;
    text-align:center;
  }

  /* ---------- CART BAR (collapsed) ---------- */
  .cart-bar{
    position:fixed; left:0; right:0; bottom:0;
    z-index:30;
    background:var(--ink);
    color:var(--paper);
    padding:0.9rem 1rem;
    display:flex;
    align-items:center;
    justify-content:space-between;
    cursor:pointer;
    transform:translateY(110%);
    transition:transform 0.3s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -6px 24px rgba(0,0,0,0.18);
  }
  .cart-bar.visible{ transform:translateY(0); }
  .cart-bar-left{
    display:flex; align-items:center; gap:0.7rem;
  }
  .cart-count{
    background:var(--mustard);
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:0.75rem;
    width:1.6rem; height:1.6rem;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
  }
  .cart-bar-text{ font-size:0.9rem; font-weight:500; }
  .cart-bar-total{
    font-family:'JetBrains Mono', monospace;
    font-size:0.95rem;
    font-weight:700;
    color:var(--mustard);
  }

  /* ---------- RECEIPT / CART PANEL ---------- */
  .overlay{
    position:fixed; inset:0;
    background:rgba(22,33,28,0.55);
    z-index:40;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.25s;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }

  .receipt{
    position:fixed;
    right:0; top:0; bottom:0;
    width:min(92vw, 400px);
    background:var(--paper);
    z-index:50;
    transform:translateX(100%);
    transition:transform 0.32s cubic-bezier(.2,.8,.2,1);
    display:flex;
    flex-direction:column;
    box-shadow:-8px 0 30px rgba(0,0,0,0.2);
  }
  .receipt.open{ transform:translateX(0); }

  .receipt-header{
    padding:1.3rem 1.3rem 1rem;
    border-bottom:2px dashed rgba(22,33,28,0.25);
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .receipt-header h2{
    font-family:'Fraunces', serif;
    font-size:1.3rem;
    font-weight:600;
  }
  .receipt-header .order-no{
    font-family:'JetBrains Mono', monospace;
    font-size:0.68rem;
    color:rgba(22,33,28,0.5);
    margin-top:0.2rem;
  }
  .close-receipt{
    background:none; border:none; cursor:pointer;
    font-size:1.3rem; line-height:1;
    color:var(--ink);
    padding:0.2rem;
  }

  .receipt-body{
    flex:1;
    overflow-y:auto;
    padding:0.5rem 1.3rem;
  }
  .receipt-line{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:0.6rem;
    padding:0.75rem 0;
    border-bottom:1px dashed rgba(22,33,28,0.15);
    font-family:'JetBrains Mono', monospace;
    font-size:0.82rem;
  }
  .receipt-line .rl-name{
    font-family:'Work Sans', sans-serif;
    font-weight:500;
    font-size:0.88rem;
  }
  .receipt-line .rl-qty{ color:rgba(22,33,28,0.5); }
  .receipt-line .rl-controls{
    display:flex; align-items:center; gap:0.4rem;
  }
  .rl-controls button{
    background:var(--paper-2);
    border:none; border-radius:4px;
    width:1.4rem; height:1.4rem;
    cursor:pointer;
    font-family:'JetBrains Mono', monospace;
  }
  .empty-cart{
    text-align:center;
    padding:3rem 1rem;
    color:rgba(22,33,28,0.5);
    font-size:0.88rem;
  }

  .receipt-summary{
    padding:1rem 1.3rem;
    border-top:2px dashed rgba(22,33,28,0.25);
    font-family:'JetBrains Mono', monospace;
    font-size:0.85rem;
  }
  .sum-row{
    display:flex; justify-content:space-between;
    padding:0.25rem 0;
    color:rgba(22,33,28,0.65);
  }
  .sum-row.total{
    color:var(--ink);
    font-weight:700;
    font-size:1.05rem;
    padding-top:0.6rem;
    margin-top:0.3rem;
    border-top:1px solid rgba(22,33,28,0.2);
  }

  .checkout-btn{
    margin:0 1.3rem 1.3rem;
    background:var(--mustard);
    color:var(--ink);
    border:none;
    padding:0.9rem;
    border-radius:8px;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:0.85rem;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:background 0.15s, transform 0.1s;
  }
  .checkout-btn:hover{ background:var(--mustard-dark); }
  .checkout-btn:active{ transform:scale(0.98); }
  .checkout-btn:disabled{
    background:rgba(22,33,28,0.15);
    color:rgba(22,33,28,0.4);
    cursor:not-allowed;
  }

  /* ---------- CHECKOUT FORM ---------- */
  .checkout-form{
    padding:0.3rem 1.3rem 1.3rem;
    display:flex;
    flex-direction:column;
    gap:0.8rem;
  }
  .field label{
    display:block;
    font-family:'JetBrains Mono', monospace;
    font-size:0.68rem;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:rgba(22,33,28,0.55);
    margin-bottom:0.3rem;
  }
  .field input, .field select{
    width:100%;
    padding:0.65rem 0.7rem;
    border:1px solid rgba(22,33,28,0.25);
    border-radius:6px;
    font-family:'Work Sans', sans-serif;
    font-size:0.9rem;
    background:white;
    color:var(--ink);
  }
  .field input:focus, .field select:focus{
    outline:2px solid var(--mustard);
    outline-offset:1px;
  }

  /* ---------- CONFIRMATION ---------- */
  .confirm{
    text-align:center;
    padding:2.5rem 1.5rem;
  }
  .confirm .stamp{
    font-family:'Fraunces', serif;
    font-size:1.6rem;
    font-weight:600;
    margin-bottom:0.4rem;
  }
  .confirm .ticket{
    font-family:'JetBrains Mono', monospace;
    background:var(--paper-2);
    border:1px dashed rgba(22,33,28,0.3);
    border-radius:8px;
    padding:1rem;
    margin:1.2rem 0;
    font-size:0.8rem;
    line-height:1.7;
    text-align:left;
  }
  .confirm p.note{
    font-size:0.85rem;
    color:rgba(22,33,28,0.6);
    line-height:1.5;
  }
  .new-order-btn{
    margin-top:1.4rem;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:0.7rem 1.2rem;
    border-radius:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:0.78rem;
    cursor:pointer;
  }

  /* Keyboard focus visibility */
  button:focus-visible, .cat-btn:focus-visible{
    outline:2px solid var(--mustard);
    outline-offset:2px;
  }

  @media (max-width:420px){
    .board h1{ font-size:2.1rem; }
  }
</style>
</head>
<body>

<div class="board">
  <div class="eyebrow">Open now &middot; Pickup at the East Hall window</div>
  <h1>The Commons<br><em>today's board</em></h1>
  <p class="sub">Order ahead from your phone, skip the line, grab it between periods.</p>
  <div class="board-meta">
    <span><strong>Pickup:</strong> 15&ndash;20 min</span>
    <span><strong>Hours:</strong> 7:30a&ndash;2:00p</span>
    <span><strong>Pay:</strong> Student ID balance</span>
  </div>
</div>

<nav class="catnav" id="catnav"></nav>

<main id="menu"></main>

<div class="cart-bar" id="cartBar">
  <div class="cart-bar-left">
    <div class="cart-count" id="cartCount">0</div>
    <div class="cart-bar-text">View order</div>
  </div>
  <div class="cart-bar-total" id="cartBarTotal">$0.00</div>
</div>

<div class="overlay" id="overlay"></div>

<aside class="receipt" id="receipt">
  <div id="receiptContent"></div>
</aside>

<script>
const MENU = [
  { id:'p1', cat:'Breakfast', name:'Cinnamon Oat Bake', desc:'Baked oats, apple, cinnamon, warm milk drizzle', price:3.25, tags:['veg'] },
  { id:'p2', cat:'Breakfast', name:'Egg & Cheese Roll', desc:'Soft roll, scrambled egg, cheddar', price:3.75, tags:[] },
  { id:'p3', cat:'Breakfast', name:'Yogurt Parfait Cup', desc:'Vanilla yogurt, granola, seasonal fruit', price:2.90, tags:['veg'] },

  { id:'l1', cat:'Lunch Mains', name:'Chicken Rice Bowl', desc:'Grilled chicken, jasmine rice, sesame greens', price:6.50, tags:[] },
  { id:'l2', cat:'Lunch Mains', name:'Veggie Stir-Fry Noodles', desc:'Wok noodles, bell pepper, carrot, broccoli', price:5.75, tags:['veg'] },
  { id:'l3', cat:'Lunch Mains', name:'Spicy Bean Burrito', desc:'Black beans, rice, salsa roja, cheddar', price:5.50, tags:['veg','spicy'] },
  { id:'l4', cat:'Lunch Mains', name:'Friday Fish & Chips', desc:'Baked white fish, oven fries, tartar', price:6.90, tags:['limited'] },

  { id:'s1', cat:'Snacks', name:'Hummus & Pretzel Cup', desc:'Classic hummus, soft pretzel bites', price:2.75, tags:['veg'] },
  { id:'s2', cat:'Snacks', name:'Baked Chip Basket', desc:'Sea salt kettle chips, small basket', price:1.95, tags:['veg'] },
  { id:'s3', cat:'Snacks', name:'Jalapeño Poppers (3)', desc:'Cream cheese, breadcrumb crust', price:3.10, tags:['spicy'] },

  { id:'d1', cat:'Drinks', name:'Iced Green Tea', desc:'Unsweetened, brewed daily', price:1.75, tags:['veg'] },
  { id:'d2', cat:'Drinks', name:'Fresh Orange Juice', desc:'Cold-pressed, no added sugar', price:2.25, tags:['veg'] },
  { id:'d3', cat:'Drinks', name:'Chocolate Milk', desc:'Cold, 12oz carton', price:1.50, tags:[] },
];

const CATEGORIES = [...new Set(MENU.map(i => i.cat))];
let cart = {}; // id -> qty

function fmt(n){ return '$' + n.toFixed(2); }

function renderCatNav(){
  const nav = document.getElementById('catnav');
  nav.innerHTML = CATEGORIES.map((c,i) =>
    `<button class="cat-btn${i===0?' active':''}" data-cat="${c}">${c}</button>`
  ).join('');
  nav.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.getElementById('sec-' + btn.dataset.cat.replace(/\s+/g,'-')).scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

function renderMenu(){
  const main = document.getElementById('menu');
  main.innerHTML = CATEGORIES.map(cat => {
    const items = MENU.filter(i => i.cat === cat);
    return `
      <div class="section-title" id="sec-${cat.replace(/\s+/g,'-')}">${cat} <span class="count">${items.length} items</span></div>
      ${items.map(renderItem).join('')}
    `;
  }).join('');
  attachItemHandlers();
}

function tagHTML(tags){
  const map = { veg:'Veg', spicy:'Spicy', limited:'Limited' };
  return tags.map(t => `<span class="tag ${t}">${map[t]}</span>`).join('');
}

function renderItem(item){
  const qty = cart[item.id] || 0;
  return `
    <div class="item" data-id="${item.id}">
      <div class="item-info">
        <div class="item-name">${item.name} ${tagHTML(item.tags)}</div>
        <div class="item-desc">${item.desc}</div>
        <div class="item-price">${fmt(item.price)}</div>
      </div>
      <div class="item-action">
        <div class="action-slot">
          ${qty === 0
            ? `<button class="add-btn" data-action="add">Add</button>`
            : `<div class="qty-control">
                 <button data-action="dec" aria-label="Remove one">−</button>
                 <span>${qty}</span>
                 <button data-action="inc" aria-label="Add one">+</button>
               </div>`
          }
        </div>
      </div>
    </div>
  `;
}

function attachItemHandlers(){
  document.querySelectorAll('.item').forEach(el => {
    const id = el.dataset.id;
    el.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        if(action === 'add' || action === 'inc'){
          cart[id] = (cart[id] || 0) + 1;
        } else if(action === 'dec'){
          cart[id] = Math.max(0, (cart[id] || 0) - 1);
          if(cart[id] === 0) delete cart[id];
        }
        updateItemSlot(id);
        updateCartBar();
        if(document.getElementById('receipt').classList.contains('open')){
          renderReceipt();
        }
      });
    });
  });
}

function updateItemSlot(id){
  const el = document.querySelector(`.item[data-id="${id}"] .action-slot`);
  const item = MENU.find(i => i.id === id);
  const qty = cart[id] || 0;
  el.innerHTML = qty === 0
    ? `<button class="add-btn" data-action="add">Add</button>`
    : `<div class="qty-control">
         <button data-action="dec" aria-label="Remove one">−</button>
         <span>${qty}</span>
         <button data-action="inc" aria-label="Add one">+</button>
       </div>`;
  el.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      if(action === 'add' || action === 'inc'){
        cart[id] = (cart[id] || 0) + 1;
      } else if(action === 'dec'){
        cart[id] = Math.max(0, (cart[id] || 0) - 1);
        if(cart[id] === 0) delete cart[id];
      }
      updateItemSlot(id);
      updateCartBar();
      if(document.getElementById('receipt').classList.contains('open')){
        renderReceipt();
      }
    });
  });
}

function cartTotal(){
  return Object.entries(cart).reduce((sum, [id, qty]) => {
    const item = MENU.find(i => i.id === id);
    return sum + item.price * qty;
  }, 0);
}
function cartCount(){
  return Object.values(cart).reduce((a,b) => a+b, 0);
}

function updateCartBar(){
  const count = cartCount();
  const bar = document.getElementById('cartBar');
  document.getElementById('cartCount').textContent = count;
  document.getElementById('cartBarTotal').textContent = fmt(cartTotal());
  bar.classList.toggle('visible', count > 0);
}

const FEE = 0.30;

function renderReceipt(){
  const items = Object.entries(cart).map(([id, qty]) => {
    const item = MENU.find(i => i.id === id);
    return { ...item, qty };
  });
  const subtotal = items.reduce((s,i) => s + i.price*i.qty, 0);
  const total = items.length ? subtotal + FEE : 0;

  const content = document.getElementById('receiptContent');
  content.innerHTML = `
    <div class="receipt-header">
      <div>
        <h2>Your order</h2>
        <div class="order-no">TICKET #${String(Math.floor(Math.random()*900+100))}</div>
      </div>
      <button class="close-receipt" id="closeReceipt" aria-label="Close">&times;</button>
    </div>
    <div class="receipt-body">
      ${items.length === 0
        ? `<div class="empty-cart">Nothing on the board yet.<br>Add something tasty →</div>`
        : items.map(i => `
          <div class="receipt-line">
            <div>
              <div class="rl-name">${i.name}</div>
              <div class="rl-qty">${i.qty} × ${fmt(i.price)}</div>
            </div>
            <div class="rl-controls">
              <button data-id="${i.id}" data-action="dec">−</button>
              <span>${fmt(i.price*i.qty)}</span>
              <button data-id="${i.id}" data-action="inc">+</button>
            </div>
          </div>
        `).join('')
      }
    </div>
    ${items.length > 0 ? `
      <div class="receipt-summary">
        <div class="sum-row"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
        <div class="sum-row"><span>Service fee</span><span>${fmt(FEE)}</span></div>
        <div class="sum-row total"><span>Total</span><span>${fmt(total)}</span></div>
      </div>
      <div class="checkout-form" id="checkoutFormWrap">
        <div class="field">
          <label for="fname">Name</label>
          <input type="text" id="fname" placeholder="Full name">
        </div>
        <div class="field">
          <label for="fclass">Class / Grade</label>
          <input type="text" id="fclass" placeholder="e.g. Grade 11B">
        </div>
        <div class="field">
          <label for="fpickup">Pickup time</label>
          <select id="fpickup">
            <option>Next available (15–20 min)</option>
            <option>Break — 10:30</option>
            <option>Lunch — 12:15</option>
            <option>End of day — 1:45</option>
          </select>
        </div>
        <button class="checkout-btn" id="placeOrderBtn">Place order — ${fmt(total)}</button>
      </div>
    ` : ''}
  `;

  document.getElementById('closeReceipt').addEventListener('click', closeReceipt);
  content.querySelectorAll('.rl-controls button').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const action = btn.dataset.action;
      if(action === 'inc') cart[id] = (cart[id]||0) + 1;
      if(action === 'dec'){
        cart[id] = Math.max(0, (cart[id]||0) - 1);
        if(cart[id] === 0) delete cart[id];
      }
      updateItemSlot(id);
      updateCartBar();
      renderReceipt();
    });
  });

  const placeBtn = document.getElementById('placeOrderBtn');
  if(placeBtn){
    placeBtn.addEventListener('click', () => {
      const name = document.getElementById('fname').value.trim();
      const cls = document.getElementById('fclass').value.trim();
      const pickup = document.getElementById('fpickup').value;
      if(!name){
        document.getElementById('fname').focus();
        return;
      }
      renderConfirmation(name, cls, pickup, items, total);
    });
  }
}

function renderConfirmation(name, cls, pickup, items, total){
  const ticket = 'TK' + Math.floor(Math.random()*9000+1000);
  const content = document.getElementById('receiptContent');
  content.innerHTML = `
    <div class="receipt-header">
      <div><h2>Order sent</h2></div>
      <button class="close-receipt" id="closeReceipt" aria-label="Close">&times;</button>
    </div>
    <div class="confirm">
      <div class="stamp">✓ Confirmed</div>
      <p class="note">Show ticket <strong>${ticket}</strong> at the East Hall window when it's ready.</p>
      <div class="ticket">
        NAME&nbsp;&nbsp;&nbsp;${name}<br>
        CLASS&nbsp;&nbsp;${cls || '—'}<br>
        PICKUP&nbsp;${pickup}<br>
        —————————————<br>
        ${items.map(i => `${i.qty}× ${i.name}`).join('<br>')}<br>
        —————————————<br>
        TOTAL&nbsp;&nbsp;${fmt(total)}
      </div>
      <button class="new-order-btn" id="newOrderBtn">Start a new order</button>
    </div>
  `;
  document.getElementById('closeReceipt').addEventListener('click', closeReceipt);
  document.getElementById('newOrderBtn').addEventListener('click', () => {
    cart = {};
    renderMenu();
    updateCartBar();
    closeReceipt();
  });
}

function openReceipt(){
  renderReceipt();
  document.getElementById('receipt').classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function closeReceipt(){
  document.getElementById('receipt').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}

document.getElementById('cartBar').addEventListener('click', openReceipt);
document.getElementById('overlay').addEventListener('click', closeReceipt);

renderCatNav();
renderMenu();
updateCartBar();
</script>

</body>
</html>
